version: 2
updates:
  # Keep every Cargo manifest in one update group. The examples are independent
  # workspaces, so they must all be listed explicitly.
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/examples/tokio"
      - "/examples/wasm"
      - "/examples/embassy-microbit-v2"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
