[workspace]
members = ["src/medi-rs", "src/medi-rs-macros"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.0"
authors = ["Burak <burak.kizilkaya@outlook.com>"]
homepage = "https://github.com/klab365/medi-rs"
repository = "https://github.com/klab365/medi-rs"
license = "MIT"
keywords = ["mediator", "cqrs", "events", "async", "di"]
categories = ["asynchronous", "rust-patterns"]
readme = "Readme.md"
exclude = ["/.github", "/.vscode", "/.devcontainer", "/docs/work", "/target", "/tmp", "/lcov.info", "/*.profraw"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
