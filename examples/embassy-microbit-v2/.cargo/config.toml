[build]
target = "thumbv7em-none-eabihf"

 # `defmt` compiles only error logs by default. Keep info logs in this firmware.
[env]
DEFMT_LOG = "info"

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip nRF52833_xxAA"
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]
